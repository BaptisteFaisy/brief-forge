name: CI

# CI du projet « brief-forge » (app Forge + serveur MCP).
#
# Le check publié s'appelle `ci` : il est exigé par le ruleset de `main` et
# par la file Mergify, comme `ci-budget` et `couche0`.
# Budget : verdict en 5 minutes au plus (règle CI maison) — installation
# des dépendances (cache npm), typage TypeScript, tests Jest, tests des
# gardes CI.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: [self-hosted, linux, x64, brief-forge-worker]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - name: Nettoyage du workspace
        shell: bash
        run: git clean -ffdx -e /node_modules

      - name: Sanity docs (UTF-8, non vides)
        run: |
          python3 - <<'EOF'
          import pathlib
          racines = [pathlib.Path(".")]
          exts = {".md", ".mdx", ".txt"}
          vides, illisibles, total = [], [], 0
          for racine in racines:
              for f in sorted(racine.rglob("*")):
                  if ".git/" in f.as_posix() or f.suffix.lower() not in exts:
                      continue
                  if "node_modules/" in f.as_posix():
                      continue
                  total += 1
                  try:
                      contenu = f.read_text(encoding="utf-8")
                  except (OSError, UnicodeError):
                      illisibles.append(f.as_posix())
                      continue
                  if not contenu.strip():
                      vides.append(f.as_posix())
          print("%d doc(s) contrôlé(s)" % total)
          for f in illisibles:
              print("::error::illisible en UTF-8 : %s" % f)
          for f in vides:
              print("::error::document vide : %s" % f)
          raise SystemExit(1 if (illisibles or vides) else 0)
          EOF

      # Node est déjà installé sur le runner self-hosted (R630) : pas de
      # `actions/setup-node`, qui téléchargerait la toolchain à chaque run et
      # ferait dépasser le budget de 5 minutes. Le cache npm de la machine est
      # réutilisé (`--prefer-offline`).
      - name: Node (version du runner)
        run: node --version

      - name: Installation des dépendances
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Typage (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Tests unitaires (jest)
        run: npx jest --ci --silent

      # Mesure de fidélité du brief sur les 30 fixtures d'intégration
      # (90 briefs = 30 × 3 budgets) ; régénère docs/FIDELITY-REPORT.md.
      - name: Fidélité du brief (harnais d'intégration)
        run: npm run fidelity

      # Les gardes de la CI se testent elles-mêmes : couche0 + agents
      # fireworks — stdlib, quelques secondes, aucun réseau.
      - name: Tests des gardes CI (couche0, fireworks)
        run: |
          # Boucle plutôt que liste figée : tout nouveau `test_*.py` est joué
          # sans retoucher ce fichier, et le premier test rouge arrête l'étape.
          # Exception : `.github/fireworks/test_agent.py` est le pilote de
          # l'agent de réparation (un module exécutable, pas une suite).
          set -e
          for t in .github/couche0/test_*.py .github/fireworks/test_*.py; do
            case "$t" in
              .github/fireworks/test_agent.py) continue ;;
            esac
            echo "== $t"
            python3 "$t"
          done
